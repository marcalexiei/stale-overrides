name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  # head_ref is empty on push, so each commit on main gets its own group and is never cancelled
  group: '${{ github.workflow }}-${{ github.head_ref || github.sha }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LEFTHOOK: 0
  CI: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})

    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      fail-fast: true
      matrix:
        node:
          - 24
          - 26
        # coverage on one leg: what the tests reach does not vary by Node version
        include:
          - node: 26
            coverage: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2
        with:
          node-version: ${{ matrix.node }}

      - name: Run build
        run: pnpm run build

      - name: Run test
        run: pnpm run "$TESTS"
        env:
          TESTS: ${{ matrix.coverage && 'test:coverage' || 'test' }}

  code-checks:
    name: Code checks

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2

      - name: Typecheck
        run: pnpm run typecheck

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Lint (knip)
        run: pnpm run lint:knip

      - name: Build
        run: pnpm run build

      - name: Lint (packaging and published types)
        run: pnpm run lint:publish

  github-actions-audit:
    name: GitHub Actions audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # required to check out the repository
    steps:
      - name: Audit GitHub Actions
        uses: marcalexiei/github-actions/audit-github-actions@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2

  ci-ok:
    name: CI OK
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    needs:
      - test
      - code-checks
      - github-actions-audit
    permissions:
      actions: read # required to list the run's jobs
      contents: read # required to read the workflow file
    steps:
      - name: Check needed jobs
        uses: marcalexiei/github-actions/check-needs@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2
        with:
          needs: ${{ toJSON(needs) }}
