# Hooks are installed by `prepare`, which pnpm runs after every install.
pre-commit:
  # `lint` and `test` read what `format` rewrote, so the order matters.
  piped: true
  jobs:
    - name: format
      glob: '*.{js,ts,json,jsonc,yaml,yml,md}'
      exclude:
        - 'tests/fixtures/**'
        - 'pnpm-lock.yaml'
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

    - name: lint
      run: pnpm run lint

    - name: test
      run: pnpm test --run
